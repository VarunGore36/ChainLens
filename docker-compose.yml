name: chainlens

services:
  postgres:
    image: postgres:17-alpine
    container_name: chainlens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: chainlens
      POSTGRES_PASSWORD: chainlens
      POSTGRES_DB: chainlens
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - chainlens-pgdata:/var/lib/postgresql/data

    command:
      - postgres
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - max_connections=50

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlens -d chainlens"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: chainlens-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - chainlens-promdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: chainlens-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: chainlens
    volumes:
      - chainlens-grafdata:/var/lib/grafana
      - ./docker/grafana-dashboard.json:/var/lib/grafana/dashboards/chainlens.json:ro

volumes:
  chainlens-pgdata:
    name: chainlens-pgdata
  chainlens-promdata:
    name: chainlens-promdata
  chainlens-grafdata:
    name: chainlens-grafdata
