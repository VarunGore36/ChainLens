# Pinning the toolchain keeps `cargo clippy -- -D warnings` reproducible. Without
# this file, a new stable release that adds a lint turns CI red with no code
# change, and local and CI disagree about what compiles.
#
# This tracks `stable` during development. Before the Phase 11 benchmark runs,
# replace `stable` with the exact version from `rustc --version` (e.g. "1.89.0"):
# codegen differences between releases are large enough to move throughput
# numbers, and a benchmark that cannot name its compiler cannot be re-run.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
