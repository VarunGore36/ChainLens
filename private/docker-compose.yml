# Local development PostgreSQL.
#
#   docker compose up -d
#   docker compose logs -f postgres
#   docker compose down          # keeps data
#   docker compose down -v       # destroys the volume
#
# Every tuning flag lives in this file rather than in a shell command or a
# hand-edited postgresql.conf, because Phase 11 benchmark numbers are
# meaningless without the configuration that produced them, and a configuration
# that is not in version control cannot be cited.

name: chainlens

services:
  postgres:
    # Major version pinned. Before the Phase 11 benchmark runs, pin the patch
    # version too (e.g. postgres:17.5-alpine) and record it in BENCHMARKS.md:
    # planner and WAL changes between minors are large enough to move results.
    image: postgres:17-alpine
    container_name: chainlens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: chainlens
      # Development only, and reachable from loopback alone (see ports below).
      # The real credential arrives through DATABASE_URL in .env, never here.
      POSTGRES_PASSWORD: chainlens
      POSTGRES_DB: chainlens
      # --data-checksums can only be set at initdb time and cannot be turned on
      # later without a dump and restore. For a project whose central claim is
      # data integrity, silent page corruption is the one failure mode that must
      # not be invisible. locale=C because every text column here is hex or an
      # address: collation-aware comparison would cost sorting speed for nothing.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C"

    # Bound to 127.0.0.1 on purpose. "5432:5432" would publish this database to
    # every interface, including the local network, with the trivial password
    # above.
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - chainlens-pgdata:/var/lib/postgresql/data

    # Sized for a development machine with roughly 16 GB of RAM. Scale
    # shared_buffers and effective_cache_size to the host before benchmarking,
    # and record what you used.
    command:
      - postgres
      # --- Durability. Do not change these two. -------------------------------
      # synchronous_commit=off would make every write benchmark in Phase 11 look
      # dramatically better by returning before the WAL reaches disk, which
      # invalidates the Phase 7 crash-recovery guarantee this project exists to
      # demonstrate. It is set explicitly so that nobody "discovers" the speedup
      # later and quietly takes it.
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      # --- Memory ------------------------------------------------------------
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      # Index builds in the Phase 11 index-cost experiment are the workload that
      # needs this; the default 64MB spills them to disk.
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      # --- Write path --------------------------------------------------------
      # The single most important setting for bulk ingestion. At the default
      # max_wal_size=1GB a backfill triggers checkpoints continuously, and the
      # resulting sawtooth is easy to misread as a problem in the indexer.
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      # --- Planner assumptions for SSD ---------------------------------------
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # --- Observability -----------------------------------------------------
      # track_io_timing makes EXPLAIN (ANALYZE, BUFFERS) report actual I/O time,
      # which is what Phase 10's query-plan documentation needs.
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - max_connections=50

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlens -d chainlens"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s


volumes:
  chainlens-pgdata:
    name: chainlens-pgdata
