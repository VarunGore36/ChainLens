name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast on a dependency resolution surprise rather than spending six
  # minutes discovering it in the test step.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so CI and local development cannot drift onto
      # different compilers.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # --locked throughout: the build fails if Cargo.lock is missing or would
      # need to change. This crate produces a binary, so the lockfile is
      # committed and is the record of exactly which versions were built and
      # benchmarked.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Catches broken intra-doc links, which is most of what goes wrong in doc
      # comments and is invisible to the other steps.
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The release profile differs enough (overflow checks off, optimisation on)
      # that it can fail while the debug build passes, and Phase 11 benchmarks
      # only ever run in release mode.
      - name: Release build
        run: cargo build --locked --release

      # From Phase 4 this job needs a PostgreSQL service container, because the
      # sqlx `query!` macros verify SQL against a live database at compile time.
      # The alternative is `cargo sqlx prepare` with the generated .sqlx
      # directory committed and SQLX_OFFLINE=true set here. Decide then; Phase 1
      # deliberately uses only runtime-checked queries, so CI needs no database
      # yet.

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

