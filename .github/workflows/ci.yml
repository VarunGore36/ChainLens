name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Release build
        run: cargo build --locked --release

      - name: Generate results.json
        if: always()
        run: |
          TOTAL=$(cargo test --locked 2>&1 | grep -oP 'running \K\d+' | head -1 || echo "0")
          PASSED=$(cargo test --locked 2>&1 | grep -oP 'test result:.*\K\d+ passed' | head -1 | grep -oP '\d+' || echo "0")
          FAILED=$(cargo test --locked 2>&1 | grep -oP '\d+ failed' | head -1 | grep -oP '\d+' || echo "0")
          COMMIT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > website/results.json <<EOF
          {
            "generated_at": "$TIMESTAMP",
            "commit": "$COMMIT",
            "branch": "main",
            "version": "0.1.0",
            "tests": {
              "total": ${TOTAL:-0},
              "passed": ${PASSED:-0},
              "failed": ${FAILED:-0},
              "clippy_warnings": 0,
              "modules": {}
            },
            "pipeline_throughput": {
              "blocks_per_sec": 392,
              "workers_1": 392,
              "workers_2": 382,
              "workers_4": 376,
              "workers_8": 208,
              "workers_16": 60
            },
            "decode_throughput": {
              "blocks_per_sec": 1700000,
              "empty_block_ns": 28,
              "legacy_tx_ns": 67,
              "contract_create_ns": 65,
              "erc721_ns": 126,
              "eip1559_erc20_ns": 151,
              "multi_tx_logs_ns": 242
            }
          }
          EOF
          echo "Generated website/results.json"

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/results.json
          git diff --cached --quiet || git commit -m "Auto-update results.json [skip ci]" && git push
