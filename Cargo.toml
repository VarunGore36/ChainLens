[package]
name = "chainlens"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "An Ethereum indexer with reorg-safe, crash-resumable ingestion"
repository = "https://github.com/VarunGore36/ChainLens"
readme = "README.md"
publish = false

[lib]
name = "chainlens"
path = "src/lib.rs"

[[bin]]
name = "chainlens"
path = "src/main.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "benchmark_harness"
path = "src/bin/benchmark_harness/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
governor = "0.8"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
alloy-primitives = { version = "0.8", features = ["serde"] }

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[profile.release]
debug = 1
